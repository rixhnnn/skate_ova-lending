<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <title>SK8 Infinity</title>
</head>
<body>
    <div class="page">
        <button class="burger" type="button" aria-label="Открыть меню">
            <span class="burger__lines" aria-hidden="true">
                <span class="burger__line"></span>
                <span class="burger__line"></span>
                <span class="burger__line"></span>
            </span>
            <span class="burger__text">MENU</span>
        </button>

        <header class="hero">
            <div class="hero__wrapper js-hero-parallax">
                <img class="hero__bg" src="img/kv_bg_base.jpg" alt="">

                <img class="hero__lame hero__lame--back hero__layer" src="img/kv_lame_r_01.png" alt="" data-depth="16">
                <img class="hero__lame hero__lame--middle hero__layer" src="img/kv_lame_r_02.png" alt="" data-depth="-22">

                <img class="hero__character hero__character--joe hero__layer" src="img/chara_joe.png" alt="" data-depth="-13">
                <img class="hero__character hero__character--miya hero__layer" src="img/chara_miya.png" alt="" data-depth="12">
                <img class="hero__character hero__character--cherry hero__layer" src="img/chara_cherry.png" alt="" data-depth="18">
                <img class="hero__shadow hero__layer" src="img/chara_shadow.png" alt="" data-depth="-8">

                <img class="hero__main hero__layer" src="img/Reki_29.png" alt="" data-depth="-24">

                <img class="hero__logo" src="img/logo/logo.svg" alt="SK8 the Infinity">

                <img class="hero__lame hero__lame--front hero__layer" src="img/kv_lame_r_03.png" alt="" data-depth="34">
                <img class="hero__lame hero__lame--small hero__layer" src="img/kv_lame_s.png" alt="" data-depth="-38">
            </div>
        </header>
    </div>

    <script src="script/main.js"></script>
</body>
</html>
